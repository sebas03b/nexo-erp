services:
  postgres:
    image: postgres:17-alpine
    container_name: nexo-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexo}
      POSTGRES_DB: ${POSTGRES_DB:-nexo_erp}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexo} -d ${POSTGRES_DB:-nexo_erp}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexo

volumes:
  postgres_data:

networks:
  nexo:
    driver: bridge
